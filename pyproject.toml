[project]
name = "astbot"
version = "0.1.0"
description = "MAX bot for production case navigation in power engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "gigachat>=0.1.0",
    "maxapi>=0.9,<1",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
astbot = "bot:main"

[tool.setuptools]
py-modules = [
    "bot",
    "case_formatters",
    "case_handlers",
    "case_models",
    "case_repository",
    "case_search",
    "case_state",
    "config",
    "formatters",
    "gigachat_client",
    "gosplan_api",
    "handlers",
    "models",
    "state",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
